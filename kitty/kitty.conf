#include ~/.config/kitty/mocha.conf
#include ~/.config/kitty/black_metal_gorgoroth.conf
include ~/.config/kitty/vague.conf
# Cursor
cursor_trail 10
cursor_trail_start_threshold 0
shell_integration no-cursor
cursor_trail_decay 0.05 0.30
cursor_shape block
cursor_blink true

# Font
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
modify_font cell_width 95%

background_opacity 0.98

tab_bar_min_tabs 1

tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom

tab_title_template {cwd}
